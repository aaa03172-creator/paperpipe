probe_id: reproducibility_missing_parameters
taxonomy: reproducibility
difficulty: hard
source_excerpt: "Methods: Immunostaining was performed with anti-X antibody overnight. The clone, supplier, catalog number, and dilution are not reported."
prompt: "Identify reproducibility blockers and avoid inventing missing reagent details."
rubrics:
  - rubric_id: missing_params
    description: "Answer names missing antibody clone or dilution details."
    kind: answer_contains_any
    terms: ["clone", "dilution", "catalog"]
  - rubric_id: unknowns
    description: "Missing reagent details are logged as unknown."
    kind: unknown_logged
  - rubric_id: no_invented_clone
    description: "Answer does not invent common clone names."
    kind: answer_not_contains
    terms: ["clone abc", "clone 1a2", "abcam ab"]

