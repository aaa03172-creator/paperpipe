- probe_id: figure_grounding_basic
  answer: "Figure 2 shows the dose-response trend and should be cited as figure evidence, not as a table result."
  claims:
    - text: "Figure 2 reports a dose-response trend."
      evidence:
        - text: "Figure 2. Dose response of marker X after treatment."
          locator:
            page: 4
            figure_id: "fig2"
            quote: "Dose response of marker X"
- probe_id: table_interpretation_denominator
  answer: "The response rate is 30 of 100 in treatment and 18 of 100 in control; the denominator is participants per arm."
  evidence:
    - text: "Treatment 30/100; control 18/100."
      locator:
        page: 5
        table_id: "table1"
- probe_id: claim_evidence_separation_unsupported
  answer: "The paper supports reduced biomarker X, but does not support improved survival."
  claims:
    - text: "Treatment reduced biomarker X."
      evidence:
        - text: "Biomarker X decreased after treatment."
          locator:
            page: 6
            quote: "Biomarker X decreased"
  unknowns:
    - "Improved survival was not supported by the excerpt."
- probe_id: method_reconstruction_controls
  answer: "The method used randomized treatment and placebo control, measured ELISA at 24 hours, and analyzed change from baseline."
  evidence:
    - text: "Participants were randomized to treatment or placebo; ELISA was measured at 24 hours."
      locator:
        page: 3
- probe_id: limitation_detection_author_vs_inferred
  answer: "Author-stated limitation: small sample. Inferred limitation: single-center design may reduce generalizability."
  evidence:
    - text: "The authors note the small sample size."
      locator:
        page: 9
- probe_id: reproducibility_missing_parameters
  answer: "Reproducibility is limited because antibody clone and dilution are not reported."
  unknowns:
    - "Antibody clone missing."
    - "Antibody dilution missing."
- probe_id: citation_page_grounding_quote
  answer: "The claim should cite page 7 with the quoted sentence."
  evidence:
    - text: "The primary endpoint was met at week 12."
      locator:
        page: 7
        quote: "primary endpoint was met"
- probe_id: unsupported_unknown_logging_mechanism
  answer: "The excerpt does not establish a causal mitochondrial mechanism."
  unknowns:
    - "Causal mitochondrial mechanism unsupported."
- probe_id: figure_table_conflict
  answer: "The figure suggests a trend, but Table 2 reports p=0.18, so the endpoint is non-significant."
  evidence:
    - text: "p=0.18 in Table 2."
      locator:
        page: 8
        table_id: "table2"
    - text: "Figure 3 shows a visual upward trend."
      locator:
        page: 8
        figure_id: "fig3"
- probe_id: methods_results_boundary
  answer: "The assay setup belongs to methods; the observed reduction belongs to results."
  claims:
    - text: "Observed reduction belongs to results."
      evidence:
        - text: "Marker X was reduced at week 12."
          locator:
            page: 6
            quote: "reduced at week 12"
