name: pr-scope-guard

on:
  pull_request:
    branches:
      - master

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce code/docs PR scope split
        run: |
          python3 scripts/check_pr_scope.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --title "${{ github.event.pull_request.title }}"
