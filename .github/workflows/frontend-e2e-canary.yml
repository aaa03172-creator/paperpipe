name: frontend-e2e-canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-e2e-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-backend-canary:
    name: e2e-backend-canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run backend canary drill (expected to fail)
        id: canary
        continue-on-error: true
        working-directory: frontend
        run: npm run e2e:backend:canary

      - name: Assert canary failed as expected
        if: always()
        run: |
          if [[ "${{ steps.canary.outcome }}" != "failure" ]]; then
            echo "Canary drill did not fail as expected (outcome=${{ steps.canary.outcome }})"
            exit 1
          fi

      - name: Upload canary Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-backend-canary-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results
