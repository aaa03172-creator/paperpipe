name: first-paper-smoke

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - README.md
      - docs/CLI_WORKFLOW_REFERENCE.md
      - docs/UX_REVIEW_REPORT_first-paper-activation.md
      - docs/UX_REVIEW_REPORT_paper-notes-viewer.md
      - backend/routers/paper_notes.py
      - frontend/public/sample.pdf
      - scripts/run_first_paper_smoke.sh
      - src/cli.py
      - tests/test_cli_import_pdf.py
      - tests/test_cli_watch_commands.py
      - tests/test_first_paper_smoke_script.py
      - tests/test_paper_notes_api.py
      - tests/test_readme_first_paper_smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-paper-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-paper-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install pytest

      - name: Run first-paper smoke
        run: ./scripts/run_first_paper_smoke.sh
