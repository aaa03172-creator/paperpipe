name: phase3-integration-optin

on:
  workflow_dispatch:
    inputs:
      run_phase3_integration:
        description: "Run Phase3 live integration tests (sets RUN_PHASE3_INTEGRATION=1)"
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - master

jobs:
  phase3-integration:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_phase3_integration == true) || vars.RUN_PHASE3_INTEGRATION == '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run Phase3 integration tests (opt-in)
        env:
          RUN_PHASE3_INTEGRATION: "1"
        run: |
          pytest -q scripts/test_phase3_integration.py
