name: soft-gate-master

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soft-gate-master
  cancel-in-progress: false

jobs:
  verify-mock:
    if: ${{ !startsWith(github.event.head_commit.message, 'revert(soft-gate):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run mock E2E
        working-directory: frontend
        run: npm run e2e:mock

      - name: Upload mock artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-gate-mock-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results

  verify-backend:
    if: ${{ !startsWith(github.event.head_commit.message, 'revert(soft-gate):') }}
    runs-on: ubuntu-latest
    needs: verify-mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run backend E2E
        working-directory: frontend
        run: npm run e2e:backend

      - name: Upload backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soft-gate-backend-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results

  auto-revert-on-failure:
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'revert(soft-gate):') }}
    runs-on: ubuntu-latest
    needs:
      - verify-mock
      - verify-backend
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "paperpipe-soft-gate[bot]"
          git config user.email "paperpipe-soft-gate-bot@users.noreply.github.com"

      - name: Revert failing master commit
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout master
          git reset --hard origin/master

          CURRENT_HEAD="$(git rev-parse HEAD)"
          if [[ "${CURRENT_HEAD}" != "${TARGET_SHA}" ]]; then
            echo "Skip revert: master head moved. head=${CURRENT_HEAD} target=${TARGET_SHA}"
            exit 0
          fi

          PARENTS_LINE="$(git rev-list --parents -n 1 "${TARGET_SHA}")"
          WORD_COUNT="$(echo "${PARENTS_LINE}" | wc -w | tr -d ' ')"
          if [[ "${WORD_COUNT}" -gt 2 ]]; then
            git revert -m 1 --no-commit "${TARGET_SHA}"
          else
            git revert --no-commit "${TARGET_SHA}"
          fi

          git commit -m "revert(soft-gate): auto-revert failing master commit ${TARGET_SHA}" \
            -m "Auto-generated by soft-gate-master workflow."
          git push origin HEAD:master

      - name: Post summary
        run: |
          {
            echo "## Soft Gate Revert Executed"
            echo ""
            echo "- target: \`${{ github.sha }}\`"
            echo "- branch: \`${{ github.ref_name }}\`"
            echo "- reason: mock/backend verification failure"
          } >> "${GITHUB_STEP_SUMMARY}"
