name: meeting-pack-verify

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meeting-pack-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meeting-pack-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install ruff

      - name: Run Meeting Pack verify lane
        run: |
          chmod +x ./frontend/scripts/run_backend_for_e2e.sh
          chmod +x ./scripts/run_meeting_pack_verify.sh
          ./scripts/run_meeting_pack_verify.sh
