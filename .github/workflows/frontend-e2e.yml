name: frontend-e2e

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_backend_e2e:
        description: "Run frontend E2E against local backend server"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mock:
    name: e2e-mock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run mock fallback E2E smoke
        id: run_mock_verify
        working-directory: frontend
        run: npm run verify:frontend:mock

      - name: Mock failure reproduction guide
        if: ${{ failure() && steps.run_mock_verify.outcome == 'failure' }}
        run: |
          {
            echo "## Frontend E2E (Mock) Failure Guide"
            echo ""
            echo "- Reproduce locally:"
            echo '  1. `cd frontend`'
            echo '  2. `npm ci`'
            echo '  3. `npx playwright install --with-deps chromium`'
            echo '  4. `npm run verify:frontend:mock`'
            echo ""
            echo "- Artifacts:"
            echo "  - \`frontend/playwright-report\`"
            echo "  - \`frontend/test-results\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload mock Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-mock-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results

  e2e-backend:
    name: e2e-backend
    runs-on: ubuntu-latest
    needs: e2e-mock
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_backend_e2e == true) || vars.RUN_FRONTEND_BACKEND_E2E == '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run backend-connected E2E smoke
        id: run_backend_verify
        working-directory: frontend
        run: npm run verify:frontend:backend

      - name: Backend failure reproduction guide
        if: ${{ failure() && steps.run_backend_verify.outcome == 'failure' }}
        run: |
          {
            echo "## Frontend E2E (Backend) Failure Guide"
            echo ""
            echo "- Reproduce locally:"
            echo '  1. `cd frontend`'
            echo '  2. `npm ci`'
            echo '  3. `npx playwright install --with-deps chromium`'
            echo '  4. `npm run verify:frontend:backend`'
            echo ""
            echo "- Artifacts:"
            echo "  - \`frontend/playwright-report\`"
            echo "  - \`frontend/test-results\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload backend Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-backend-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results
