name: frontend-e2e

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_backend_e2e:
        description: "Run frontend E2E against local backend server"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mock:
    name: e2e-mock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run mock fallback E2E smoke
        working-directory: frontend
        run: npm run e2e:mock

      - name: Upload mock Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results

  e2e-backend:
    name: e2e-backend
    runs-on: ubuntu-latest
    needs: e2e-mock
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_backend_e2e == true) || vars.RUN_FRONTEND_BACKEND_E2E == '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run backend-connected E2E smoke
        working-directory: frontend
        run: npm run e2e:backend

      - name: Upload backend Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-backend-artifacts
          if-no-files-found: ignore
          path: |
            frontend/playwright-report
            frontend/test-results
