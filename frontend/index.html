<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lattice Analysis Workbench</title>
    <style>
      :root {
        --bg-0: #f4f6f8;
        --bg-1: #e6ecef;
        --panel: rgba(255, 255, 255, 0.82);
        --ink: #13212d;
        --ink-soft: #4b5e70;
        --line: rgba(18, 36, 51, 0.14);
        --brand: #067f7b;
        --brand-2: #0a556c;
        --accent: #d56a2d;
        --success: #0f8d4e;
        --warn: #a35d0f;
        --error: #b23a3a;
        --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        --sans: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: var(--sans);
        background:
          radial-gradient(1200px 800px at -15% -10%, rgba(6, 127, 123, 0.18), transparent 55%),
          radial-gradient(950px 700px at 105% 15%, rgba(213, 106, 45, 0.16), transparent 52%),
          linear-gradient(165deg, var(--bg-0) 5%, var(--bg-1) 100%);
      }

      .shell {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
        padding: 18px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 8px 34px rgba(11, 30, 50, 0.08);
        backdrop-filter: blur(4px);
      }

      .rail {
        padding: 14px;
        display: grid;
        gap: 12px;
        align-self: start;
        position: sticky;
        top: 16px;
      }

      .brand {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .sub {
        margin-top: 2px;
        color: var(--ink-soft);
        font-size: 12px;
      }

      .toolbar {
        display: grid;
        gap: 10px;
      }

      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-soft);
      }

      select,
      button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--line);
        padding: 10px;
        font-size: 13px;
        color: var(--ink);
        background: #fff;
      }

      button {
        cursor: pointer;
      }

      button.primary {
        border: none;
        color: #fff;
        font-weight: 700;
        background: linear-gradient(120deg, var(--brand) 0%, var(--brand-2) 100%);
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .paper-list {
        max-height: 56vh;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
      }

      .paper-item {
        width: 100%;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        padding: 10px 12px;
      }

      .paper-item:last-child {
        border-bottom: none;
      }

      .paper-item.active {
        background: rgba(6, 127, 123, 0.1);
      }

      .paper-title {
        font-size: 13px;
        font-weight: 600;
      }

      .paper-meta {
        margin-top: 4px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-soft);
      }

      .stage {
        display: grid;
        gap: 12px;
      }

      .stage .row {
        padding: 14px;
      }

      .headline {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
      }

      .status-pill {
        font-family: var(--mono);
        font-size: 12px;
        border-radius: 999px;
        padding: 6px 10px;
        background: rgba(10, 85, 108, 0.14);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .kpi {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
      }

      .kpi dt {
        font-size: 11px;
        color: var(--ink-soft);
        margin-bottom: 4px;
      }

      .kpi dd {
        margin: 0;
        font-family: var(--mono);
        font-size: 13px;
      }

      .log-box,
      .artifact-box {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(15, 32, 49, 0.95);
        color: #d8e4eb;
        padding: 12px;
        min-height: 220px;
        max-height: 360px;
        overflow: auto;
        font-family: var(--mono);
        font-size: 12px;
        white-space: pre-wrap;
      }

      .artifact-box {
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
      }

      .artifact-empty {
        color: var(--ink-soft);
      }

      @media (max-width: 1080px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .rail {
          position: static;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <aside class="rail card">
        <div>
          <div class="brand">Lattice</div>
          <div class="sub">Analysis Workbench</div>
        </div>

        <section class="toolbar">
          <label for="personaSelect">Persona</label>
          <select id="personaSelect"></select>

          <label class="toggle"><input id="runVerify" type="checkbox" checked /> Run verify</label>
          <label class="toggle"><input id="cleanReindex" type="checkbox" /> Clean reindex</label>

          <button id="runButton" class="primary" type="button">Start Deep Read</button>
          <button id="refreshButton" type="button">Refresh Artifacts</button>
        </section>

        <section>
          <div class="sub">Papers</div>
          <div id="paperList" class="paper-list"></div>
        </section>
      </aside>

      <section class="stage">
        <div class="row card">
          <div class="headline">
            <div class="title" id="paperTitle">Select a paper</div>
            <div class="status-pill" id="jobStatus">idle</div>
          </div>
          <div class="grid" style="margin-top: 12px">
            <dl class="kpi">
              <dt>Paper ID</dt>
              <dd id="paperId">-</dd>
            </dl>
            <dl class="kpi">
              <dt>Run ID</dt>
              <dd id="runId">-</dd>
            </dl>
            <dl class="kpi">
              <dt>Job ID</dt>
              <dd id="jobId">-</dd>
            </dl>
            <dl class="kpi">
              <dt>Progress</dt>
              <dd id="jobProgress">0%</dd>
            </dl>
          </div>
        </div>

        <div class="row card">
          <div class="sub" style="margin-bottom: 8px">Live Logs</div>
          <div id="logBox" class="log-box"></div>
        </div>

        <div class="row card">
          <div class="sub" style="margin-bottom: 8px">Artifacts</div>
          <div id="artifactBox" class="artifact-box artifact-empty">No artifacts loaded.</div>
        </div>
      </section>
    </main>

    <script>
      const state = {
        selectedPaper: null,
        runId: null,
        jobId: null,
        source: null,
      };

      const ids = {
        personaSelect: document.getElementById("personaSelect"),
        runVerify: document.getElementById("runVerify"),
        cleanReindex: document.getElementById("cleanReindex"),
        runButton: document.getElementById("runButton"),
        refreshButton: document.getElementById("refreshButton"),
        paperList: document.getElementById("paperList"),
        paperTitle: document.getElementById("paperTitle"),
        paperId: document.getElementById("paperId"),
        runId: document.getElementById("runId"),
        jobId: document.getElementById("jobId"),
        jobStatus: document.getElementById("jobStatus"),
        jobProgress: document.getElementById("jobProgress"),
        logBox: document.getElementById("logBox"),
        artifactBox: document.getElementById("artifactBox"),
      };

      function appendLog(line, level = "INFO") {
        const prefix = level === "ERROR" ? "ERR" : level === "WARNING" ? "WRN" : "LOG";
        ids.logBox.textContent += `[${prefix}] ${line}\n`;
        ids.logBox.scrollTop = ids.logBox.scrollHeight;
      }

      async function fetchJson(url, options) {
        const res = await fetch(url, options);
        if (!res.ok) {
          throw new Error(`${res.status} ${res.statusText}`);
        }
        return res.json();
      }

      function updateMeta() {
        ids.paperId.textContent = state.selectedPaper || "-";
        ids.runId.textContent = state.runId || "-";
        ids.jobId.textContent = state.jobId || "-";
      }

      function renderPaperList(items) {
        ids.paperList.innerHTML = "";
        for (const p of items) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "paper-item";
          button.innerHTML = `<div class="paper-title">${p.title || p.paper_id}</div><div class="paper-meta">${p.paper_id}</div>`;
          button.addEventListener("click", () => {
            state.selectedPaper = p.paper_id;
            ids.paperTitle.textContent = p.title || p.paper_id;
            updateMeta();
            for (const node of ids.paperList.querySelectorAll(".paper-item")) {
              node.classList.remove("active");
            }
            button.classList.add("active");
          });
          ids.paperList.appendChild(button);
        }
      }

      async function loadPapers() {
        const papers = await fetchJson("/papers");
        renderPaperList(papers);
        if (!state.selectedPaper && papers.length > 0) {
          ids.paperList.querySelector(".paper-item")?.click();
        }
      }

      async function loadPersonas() {
        const data = await fetchJson("/personas");
        ids.personaSelect.innerHTML = "";
        for (const persona of data.personas) {
          const option = document.createElement("option");
          option.value = persona.id;
          option.textContent = persona.id === "default" ? "default (recommended)" : persona.title;
          ids.personaSelect.appendChild(option);
        }
      }

      function stopStream() {
        if (state.source) {
          state.source.close();
          state.source = null;
        }
      }

      function connectEvents(jobId) {
        stopStream();
        const source = new EventSource(`/jobs/${encodeURIComponent(jobId)}/events`);
        state.source = source;

        source.addEventListener("status", (event) => {
          try {
            const payload = JSON.parse(event.data);
            ids.jobStatus.textContent = payload.status || "running";
            ids.jobProgress.textContent = `${payload.progress || 0}%`;
            if (payload.run_id) {
              state.runId = payload.run_id;
              updateMeta();
            }
          } catch (_err) {
            ids.jobStatus.textContent = "running";
          }
        });

        source.addEventListener("log", (event) => appendLog(event.data));
        source.addEventListener("artifact_ready", (event) => {
          try {
            const payload = JSON.parse(event.data);
            if (payload.run_id) {
              state.runId = payload.run_id;
              updateMeta();
              refreshArtifacts();
            }
          } catch (_err) {}
        });

        source.addEventListener("done", async (event) => {
          ids.jobStatus.textContent = event.data || "completed";
          appendLog(`terminal=${event.data}`);
          await refreshArtifacts();
          stopStream();
        });

        source.addEventListener("error", (event) => {
          appendLog(`stream_error=${event.data || "unknown"}`, "ERROR");
        });
      }

      async function runDeepRead() {
        if (!state.selectedPaper) {
          appendLog("Select a paper first.", "WARNING");
          return;
        }
        ids.logBox.textContent = "";
        ids.artifactBox.classList.add("artifact-empty");
        ids.artifactBox.textContent = "Loading artifacts...";

        const body = {
          paper_id: state.selectedPaper,
          persona_id: ids.personaSelect.value || "default",
          run_verify: ids.runVerify.checked,
          clean_reindex: ids.cleanReindex.checked,
        };

        const queued = await fetchJson("/jobs/deepread", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        state.jobId = queued.job_id;
        state.runId = queued.run_id || null;
        ids.jobStatus.textContent = queued.status;
        ids.jobProgress.textContent = "0%";
        updateMeta();
        appendLog(`queued job=${queued.job_id} run=${queued.run_id || "n/a"}`);
        connectEvents(queued.job_id);
      }

      function renderArtifacts(data) {
        const claimset = data.claimset || {};
        const stats = data.stats_report || {};
        const chunks = data.chunks || {};
        const claims = claimset?.data?.claims || [];
        const checks = stats?.data?.checks || [];
        ids.artifactBox.classList.remove("artifact-empty");
        ids.artifactBox.textContent =
          `claimset_source=${data.claimset_source || "none"}\n` +
          `claims=${claims.length}\n` +
          `stats_checks=${checks.length}\n` +
          `chunks_lines=${chunks?.data?.line_count || 0}\n\n` +
          JSON.stringify(
            {
              claim_preview: claims.slice(0, 3).map((c) => ({
                statement: c.statement,
                confidence: c.confidence,
                type: c.type,
              })),
              stats_preview: checks.slice(0, 3).map((c) => ({
                test_type: c.test_type,
                verdict: c.verdict,
              })),
              chunk_preview: chunks?.data?.preview || [],
            },
            null,
            2
          );
      }

      async function refreshArtifacts() {
        if (!state.selectedPaper || !state.runId) {
          ids.artifactBox.classList.add("artifact-empty");
          ids.artifactBox.textContent = "No artifacts loaded.";
          return;
        }
        try {
          const data = await fetchJson(
            `/obsidian/artifacts?paper_id=${encodeURIComponent(state.selectedPaper)}&run_id=${encodeURIComponent(state.runId)}`
          );
          renderArtifacts(data);
        } catch (err) {
          ids.artifactBox.classList.add("artifact-empty");
          ids.artifactBox.textContent = `Failed to load artifacts: ${err}`;
        }
      }

      async function init() {
        try {
          await Promise.all([loadPapers(), loadPersonas()]);
          appendLog("Workbench ready.");
        } catch (err) {
          appendLog(`init_error=${err}`, "ERROR");
        }
      }

      ids.runButton.addEventListener("click", () => runDeepRead().catch((err) => appendLog(String(err), "ERROR")));
      ids.refreshButton.addEventListener("click", () => refreshArtifacts().catch((err) => appendLog(String(err), "ERROR")));

      init();
    </script>
  </body>
</html>
