system:
  backfill_limit_days: 3
  log_level: "INFO"

paths:
  # Update to your local environment.
  zotero_base_dir: "/path/to/Zotero/storage"
  obsidian_vault: "/path/to/Obsidian/MyVault"
  index_all: "00_Index/paper_collection.csv"
  index_clinical: "00_Index/mct_mci_trials.csv"
  upload_dir: "/path/to/NotebookLM_Upload"
  export_dir: "export"
  watch_folder: "/path/to/PaperPipe_Watch"
  library_dir: "Library"
  downloads_watch_dir: "~/Downloads"
  pdf_storage_dir: "storage/pdfs"

search:
  constraints:
    min_pubmed: 2
    max_preprint: 1
  slots:
    mechanism:
      query: '(ASM OR "acid sphingomyelinase" OR sphingolipid OR ceramide OR autophagy OR lysosome) AND (microglia OR HMGB1 OR neuroinflammation)'
      source: "pubmed"
    clinical:
      query: '(MCI OR "Mild Cognitive Impairment") AND (MCT OR "Medium-chain triglyceride" OR ketone OR "ketogenic diet")'
      source: "pubmed"
    methods:
      query: '"Cre-ER" OR "Cre-loxP" OR tamoxifen OR genotyping OR "recombination efficiency"'
      source: "pubmed"

llm:
  mode: "local" # Default: local-first
  local:
    provider: "ollama"
    base_url: "http://localhost:11434"
    models:
      classifier: "llama3:8b"
      tagger: "biomistral:7b"
      embedder: "nomic-embed-text"
      judge: "openhermes-2.5-mistral"
      chat: "phi3"
      extractor: "llama3:8b"
      one_liner: "phi3"
      deep_read: "llama3:8b"
      relevance_analyzer: "llama3:8b"
  cloud:
    provider: "openai"
    api_key: "" # Optional unless mode == "cloud"
    model: "gpt-4o"
  features:
    trial_extraction:
      enabled: true
      model: "llama3:8b"
    slot_classification:
      enabled: true
      model: "llama3:8b"
    one_liner:
      enabled: true
      model: "phi3"
  timeout_seconds: 120
  max_retries: 2

ingest:
  parser_backend: "fitz_pdfplumber" # options: fitz_pdfplumber, docling
  enable_docling: false
  enable_ocr_fallback: false
  ocr_lang: "eng"
  ocr_min_text_chars: 200
  enable_table_pass2_ocr: false
  enable_cloud_table_fallback: false
  cloud_table_page_budget: 1
  cloud_table_model: "gpt-4o-mini"
  cloud_table_base_url: null
  cloud_table_api_key: "" # default uses OPENAI_API_KEY if empty
  cloud_table_timeout_seconds: 30

unpaywall:
  email: null

confidence_thresholds:
  high: 0.90
  low: 0.70

ranking:
  bibliometrics:
    enabled: false
    weights:
      novelty: 0.4
      impact: 0.4
      venue: 0.2
    thresholds:
      min_citations: 0.0
      min_h_index: 0.0

sources: {}
entity_aliases: {}
agents:
  enabled: false
  backend: "ollama_adapter"
  main_model: "llama3:latest"
  rag_index_path: "./storage/rag/"
  feedback_index_path: "./storage/feedback_index/"
  tools:
    retrieval: true
    python_repl: true
    web_search: false
  logging:
    trace_file: "logs/agent_trace.jsonl"
